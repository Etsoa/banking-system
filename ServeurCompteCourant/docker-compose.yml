version: '3.8'
services:
  comptecourant-ejb:
    build: .
    container_name: comptecourant
    ports:
      - "8082:8080"
      - "9991:9990"
    environment:
      - JAVA_OPTS=-Xms512m -Xmx1024m
    networks:
      - banking-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/comptecourant/api/comptes"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  banking-network:
    driver: bridge
