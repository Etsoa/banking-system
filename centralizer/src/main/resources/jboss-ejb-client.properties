# Configuration de connexion EJB client pour les services distants
# Cette configuration permet à Centralizer (WildFly local) de se connecter aux services EJB distants

# Configuration pour le service Echange (déployé sur Docker)
# Adresse de la machine Docker hébergeant Echange
remote.connectionprovider.create.options.org.xnio.Options.SSL_ENABLED=false
remote.connections=echange

# Connexion au serveur Echange sur Docker
remote.connection.echange.host=host.docker.internal
remote.connection.echange.port=8081
remote.connection.echange.connect.options.org.xnio.Options.SASL_POLICY_NOANONYMOUS=false
remote.connection.echange.connect.options.org.xnio.Options.SSL_ENABLED=false

# Timeout et propriétés de fiabilité
remote.connection.echange.connect.options.org.xnio.Options.HEARTBEAT_INTERVAL=60000
